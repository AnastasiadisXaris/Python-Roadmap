<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Roadmap</title>
  <meta name="description" content="Διαδραστικός οδηγός εκμάθησης Python — από τα βασικά μέχρι το Machine Learning.">
  <link rel="icon" type="image/png" href="python.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="logo-mark" aria-hidden="true">🐍</span>
        <div>
          <p class="eyebrow-title">Roadmap</p>
          <h1 class="app-title">Python</h1>
        </div>
      </div>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">
        <span>Ενότητες</span>
      </button>

      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Αναζήτηση στο περιεχόμενο…" aria-label="Αναζήτηση ενοτήτων">
      </div>

      <nav class="path-nav" id="path-nav" aria-label="Ενότητες μαθήματος"></nav>
      <p class="no-results hidden" id="no-results">Καμία ενότητα δεν ταιριάζει.</p>

      <button class="graph-toggle" id="graph-toggle" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="3" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="13" cy="3" r="2" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="13" cy="13" r="2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 7.3L11 4M5 8.7L11 12" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        <span>Χάρτης ενοτήτων</span>
      </button>
    </aside>

    <main class="content">
      <p class="breadcrumb" id="breadcrumb"></p>
      <article id="markdown-content" class="markdown-body"></article>
    </main>
  </div>

  <div class="graph-overlay" id="graph-overlay" hidden>
    <div class="graph-panel">
      <button class="graph-close" id="graph-close" type="button" aria-label="Κλείσιμο χάρτη">✕</button>
      <svg id="graph-svg"></svg>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
